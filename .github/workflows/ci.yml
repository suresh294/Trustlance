name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            blockchain/package-lock.json
            frontend/package-lock.json

      - name: Install blockchain dependencies
        run: npm ci --prefix blockchain

      - name: Compile Solidity contracts
        env:
          RPC_URL: https://rpc-amoy.polygon.technology
        run: npm run compile --prefix blockchain

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Report dependency audit findings
        continue-on-error: true
        run: |
          npm audit --prefix blockchain --json > /tmp/blockchain-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/blockchain-audit.json');
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = item.via.map((entry) => typeof entry === 'string' ? entry : entry.title).join('; ');
            console.log(`blockchain ${name}: ${item.severity}; fixAvailable=${JSON.stringify(item.fixAvailable)}; ${via}`);
          }
          NODE
          npm audit --prefix frontend --json > /tmp/frontend-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/frontend-audit.json');
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = item.via.map((entry) => typeof entry === 'string' ? entry : entry.title).join('; ');
            console.log(`frontend ${name}: ${item.severity}; fixAvailable=${JSON.stringify(item.fixAvailable)}; ${via}`);
          }
          NODE

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q backend
